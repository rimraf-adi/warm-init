[project]
name = "tone-donor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tone_donor"]
